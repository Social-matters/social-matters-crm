services:
  mysql:
    image: mysql:8.0
    container_name: sm_crm_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: social_matters_crm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sm_crm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sm_crm_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://crm_user:crm_password@mysql:3306/social_matters_crm"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      JWT_SECRET: "social_matters_crm_jwt_production_secret_key_2026"
      JWT_EXPIRES_IN: "1d"
      JWT_REFRESH_SECRET: "social_matters_crm_refresh_production_secret_key_2026"
      JWT_REFRESH_EXPIRES_IN: "7d"
      META_VERIFY_TOKEN: "social_matters_meta_verify_token_2026"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sm_crm_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  redis_data:
