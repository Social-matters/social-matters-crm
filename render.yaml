services:
  - type: web
    name: social-matters-crm-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:shared && npm run db:generate && npm run build:api
    startCommand: npm run start:prod --workspace=apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        value: social_matters_crm_default_32byte_master_encryption_key_2026
      - key: META_VERIFY_TOKEN
        value: social_matters_meta_verify_token_2026
      - key: WEB_APP_URL
        sync: false
